[[pages]]
domain = "os.gnome.org"
origin = "https://teams.pages.gitlab.gnome.org/Websites/os.gnome.org/"
vcl_snippet = "os"
custom_vcl = """
  if (req.url ~ "^/download(/|$)") {
    set req.backend = F_gnome_os_download;
    set req.http.Host = "gnome-os-download.apps.openshift.gnome.org";
    set req.url = regsub(req.url, "^/download", "");
    return(lookup);
  }
"""

[pages.subpath_proxies]
"/docs/" = "https://gnome.pages.gitlab.gnome.org/gnome-build-meta/docs/"
