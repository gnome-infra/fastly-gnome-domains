[[pages]]
domain = "gnomeboxes.org"
vcl_snippet = "gnomeboxes"
custom_vcl = """
  # Locale-prefixed paths: /xx/... → /xx/Boxes/...
  if (req.url ~ "^/([a-z]{2})(/.*)$") {
    set req.url = "/" re.group.1 "/Boxes" re.group.2;
    set req.http.Host = "apps.gnome.org";
    return;
  }

  # Assets: pass through unchanged (apps.gnome.org uses same /assets/ path)
  if (req.url ~ "^/assets/") {
    set req.http.Host = "apps.gnome.org";
    return;
  }

  # Default: / → /Boxes/
  set req.url = "/Boxes" req.url;
  set req.http.Host = "apps.gnome.org";
"""
