[[pages]]
domain = "help.gnome.org"
origin = "https://teams.pages.gitlab.gnome.org/Websites/help.gnome.org/"
vcl_snippet = "help"
custom_vcl = """
  # /users/<component>/ → /<component>/
  if (req.url ~ "^/users/([^/]+)/$") {
    error 751 "https://help.gnome.org/" re.group.1 "/";
  }

  # /users/<component>/<version>/<page> → /<component>/<page>
  if (req.url ~ "^/users/([^/]+)/[^/]+/(.+)$") {
    error 751 "https://help.gnome.org/" re.group.1 "/" re.group.2;
  }

  # /users/<component>/<version>/ → /<component>/
  if (req.url ~ "^/users/([^/]+)/[^/]+/$") {
    error 751 "https://help.gnome.org/" re.group.1 "/";
  }

  # /users/<component>/<page> → /<component>/<page>
  if (req.url ~ "^/users/([^/]+)/([^/]+)$") {
    error 751 "https://help.gnome.org/" re.group.1 "/" re.group.2;
  }

  # /admin/<component>/ → /<component>/
  if (req.url ~ "^/admin/([^/]+)/$") {
    error 751 "https://help.gnome.org/" re.group.1 "/";
  }

  # /admin/<component>/<version>/<page> → /<component>/<page>
  if (req.url ~ "^/admin/([^/]+)/[^/]+/(.+)$") {
    error 751 "https://help.gnome.org/" re.group.1 "/" re.group.2;
  }

  # /admin/<component>/<version>/ → /<component>/
  if (req.url ~ "^/admin/([^/]+)/[^/]+/$") {
    error 751 "https://help.gnome.org/" re.group.1 "/";
  }

  # /admin/<component>/<page> → /<component>/<page>
  if (req.url ~ "^/admin/([^/]+)/([^/]+)$") {
    error 751 "https://help.gnome.org/" re.group.1 "/" re.group.2;
  }

  # Strip .en suffix from .html.en → .html
  if (req.url ~ "^(.*\.html)\.en$") {
    error 751 "https://help.gnome.org" re.group.1;
  }
"""
