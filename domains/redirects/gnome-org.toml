[[redirects]]
domain = "gnome.org"
target = "https://www.gnome.org"
type = "permanent"
preserve_path = true
vcl_snippet = "gnome-org"
custom_vcl = """
  if (req.url == "/.well-known/matrix/server") {
    error 760;
  }
  if (req.url == "/.well-known/matrix/client") {
    error 761;
  }
  if (req.url == "/.well-known/microsoft-identity-association.json") {
    error 762;
  }
  if (req.url == "/.well-known/security.txt") {
    error 763;
  }
"""
custom_vcl_error = """
  # Matrix server discovery
  if (obj.status == 760) {
    set obj.status = 200;
    set obj.http.Content-Type = "application/json";
    set obj.http.Access-Control-Allow-Origin = "*";
    synthetic {"{ "m.server": "gnome.modular.im:443" }"};
    return(deliver);
  }

  # Matrix client discovery
  if (obj.status == 761) {
    set obj.status = 200;
    set obj.http.Content-Type = "application/json";
    set obj.http.Access-Control-Allow-Origin = "*";
    set obj.http.Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS";
    set obj.http.Access-Control-Allow-Headers = "X-Requested-With, Content-Type, Authorization";
    synthetic {"{ "m.homeserver": { "base_url": "https://gnome.modular.im" }, "m.identity_server": { "base_url": "https://vector.im" }, "org.matrix.msc4143.rtc_foci": [ { "type": "livekit", "livekit_service_url": "https://jwt.call.element.io" } ] }"};
    return(deliver);
  }

  # Microsoft identity association
  if (obj.status == 762) {
    set obj.status = 200;
    set obj.http.Content-Type = "application/json";
    synthetic {"{ "associatedApplications": [ { "applicationId": "8ef61e06-9fd5-49af-9b63-6983aede4213" }, { "applicationId": "b155a604-3c31-4079-93b0-6bb6aa9d5464" } ] }"};
    return(deliver);
  }

  # Security.txt
  if (obj.status == 763) {
    set obj.status = 200;
    set obj.http.Content-Type = "text/plain";
    synthetic {"Contact: https://security.gnome.org/
Expires: 2035-01-01T18:30:00.000Z
Preferred-Languages: en"};
    return(deliver);
  }
"""
